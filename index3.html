<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nutty Heist: Squirrel & Cosita Park Panic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050510;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
        }
        .btn {
            pointer-events: auto;
            padding: 15px 40px;
            font-size: 1.5rem;
            background-color: #4ade80;
            color: #111;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(74, 222, 128, 0.4);
            transition: transform 0.1s, background-color 0.2s;
        }
        .btn:hover { background-color: #22c55e; }
        .btn:active { transform: scale(0.95); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div id="start-screen">
            <h1 class="text-4xl md:text-5xl font-bold mb-3 text-green-400 tracking-wider">NUTTY HEIST</h1>
            <p class="text-xl text-yellow-300 font-semibold mb-4">Squirrel & Dame Tu Cosita's Taco Rush 🌮🐿️</p>
            <div class="bg-black/80 p-5 rounded-xl mb-5 text-left border border-green-400 shadow-xl max-w-sm">
                <strong class="text-green-300 text-lg">How to Play:</strong>
                <ul class="list-disc pl-5 mt-2 space-y-1 text-sm md:text-base">
                    <li><strong>Phase 1 (Sky):</strong> Tap/Space to fly through pipes.</li>
                    <li><strong>Phase 2 (Ground):</strong> Drag/Move mouse to catch falling food!</li>
                    <li><strong>Goal:</strong> Catch Tacos 🌮 & Acorns 🌰, avoid Bombs 💣!</li>
                </ul>
            </div>
            <button class="btn" onclick="startGame()">Tap to Play</button>
        </div>
        
        <div id="game-over-screen" class="hidden">
            <h1 id="go-title" class="text-4xl md:text-5xl font-bold mb-2 text-red-500">Game Over!</h1>
            <p id="go-score" class="text-2xl mb-6 text-yellow-300">Tacos & Acorns Caught: 0</p>
            <button class="btn" onclick="startGame()">Play Again</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let GAME_WIDTH = window.innerWidth;
        let GAME_HEIGHT = window.innerHeight;
        let GROUND_Y = 4000;
        
        let state = 'TITLE';
        let time = 0;
        let cameraY = 0;

        let bird = { x: 100, y: GAME_HEIGHT/2, vy: 0, radius: 15, frozen: false };
        let pipes = [];
        let flappyScore = 0;
        const GRAVITY = 0.4;
        const JUMP = -8;
        const PIPE_SPEED = 3;
        const PIPE_WIDTH = 70;
        const PIPE_GAP = 180;
        const FLAPPY_WIN_SCORE = 3;

        let unusualPoop = { x: 0, y: 0, vy: 0, type: '🌮' };
        let particles = [];
        let clouds = [];

        let alien = { x: GAME_WIDTH / 2 - 30, y: GROUND_Y - 100, width: 40 };
        let squirrel = { x: GAME_WIDTH / 2 + 30, y: GROUND_Y - 50 };
        
        let items = [];
        let catcherScore = 0;
        let catcherLives = 3;
        let spawnTimer = 0;
        let catcherDifficulty = 1;
        let targetAlienX = GAME_WIDTH / 2;

        let eatingTimer = 0;
        let chompTexts = [];
        let flyingTacos = [];

        window.addEventListener('resize', () => {
            GAME_WIDTH = window.innerWidth;
            GAME_HEIGHT = window.innerHeight;
            canvas.width = GAME_WIDTH;
            canvas.height = GAME_HEIGHT;
            if(state === 'CATCHER' || state === 'EATING_ANIMATION' || state === 'GAMEOVER') {
                cameraY = GROUND_Y - GAME_HEIGHT;
            }
        });
        window.dispatchEvent(new Event('resize'));

        function handlePointerDown(e) {
            if (state === 'FLAPPY' && !bird.frozen) {
                bird.vy = JUMP;
            }
            updatePointer(e);
        }

        function handlePointerMove(e) { updatePointer(e); }

        function updatePointer(e) {
            if (state === 'CATCHER') {
                let clientX = e.touches ? e.touches[0].clientX : e.clientX;
                targetAlienX = clientX;
            }
        }

        window.addEventListener('mousedown', handlePointerDown);
        window.addEventListener('touchstart', handlePointerDown, {passive: false});
        window.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('touchmove', handlePointerMove, {passive: false});

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && state === 'FLAPPY' && !bird.frozen) {
                bird.vy = JUMP;
            }
        });

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            
            bird = { x: GAME_WIDTH/3, y: GAME_HEIGHT/2, vy: 0, radius: 15, frozen: false };
            pipes = [];
            flappyScore = 0;
            cameraY = 0;
            particles = [];
            
            items = [];
            catcherScore = 0;
            catcherLives = 3;
            spawnTimer = 0;
            catcherDifficulty = 1;
            targetAlienX = GAME_WIDTH / 2;
            alien.x = targetAlienX - 30;
            squirrel.x = targetAlienX + 30;

            eatingTimer = 0;
            chompTexts = [];
            flyingTacos = [];

            clouds = [];
            for (let i = 0; i < 15; i++) {
                clouds.push({
                    x: Math.random() * GAME_WIDTH,
                    y: Math.random() * GAME_HEIGHT * 0.7,
                    speed: Math.random() * 0.5 + 0.1,
                    scale: Math.random() * 0.5 + 0.5
                });
            }

            state = 'FLAPPY';
            spawnPipe();
        }

        function gameOver(reason) {
            state = 'EATING_ANIMATION';
            eatingTimer = 0;
            alien.x = GAME_WIDTH / 2 - 40;
            squirrel.x = GAME_WIDTH / 2 + 40;
            chompTexts = [];
            flyingTacos = [];
            
            document.getElementById('go-title').innerText = reason;
            document.getElementById('go-score').innerText = `Total Score: ${catcherScore}`;

            setTimeout(() => {
                if (state === 'EATING_ANIMATION') {
                    document.getElementById('game-over-screen').classList.remove('hidden');
                }
            }, 2000);
        }

        function update() {
            time++;

            clouds.forEach(c => {
                c.x -= c.speed;
                if (c.x + 200 < 0) {
                    c.x = GAME_WIDTH + 100;
                    c.y = Math.random() * GAME_HEIGHT * 0.7;
                }
            });

            if (state === 'FLAPPY') {
                if (!bird.frozen) {
                    bird.vy += GRAVITY;
                    bird.y += bird.vy;

                    if (pipes.length === 0 || pipes[pipes.length - 1].x < GAME_WIDTH - 250) {
                        spawnPipe();
                    }

                    for (let i = pipes.length - 1; i >= 0; i--) {
                        let p = pipes[i];
                        p.x -= PIPE_SPEED;

                        if (!p.passed && p.x + PIPE_WIDTH < bird.x) {
                            p.passed = true;
                            flappyScore++;
                            if (flappyScore >= FLAPPY_WIN_SCORE) {
                                triggerTransition();
                            }
                        }

                        if (bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + PIPE_WIDTH) {
                            if (bird.y - bird.radius < p.topHeight || bird.y + bird.radius > p.topHeight + PIPE_GAP) {
                                startGame();
                            }
                        }

                        if (p.x + PIPE_WIDTH < 0) {
                            pipes.splice(i, 1);
                        }
                    }

                    if (bird.y + bird.radius > GAME_HEIGHT || bird.y - bird.radius < 0) {
                        startGame();
                    }
                }
            } 
            else if (state === 'TRANSITION') {
                unusualPoop.vy += 0.2;
                unusualPoop.y += unusualPoop.vy;
                
                if (time % 2 === 0) {
                    particles.push({
                        x: unusualPoop.x + (Math.random() - 0.5) * 20,
                        y: unusualPoop.y,
                        vx: (Math.random() - 0.5) * 2,
                        vy: (Math.random() - 0.5) * 2,
                        life: 30,
                        maxLife: 30
                    });
                }

                let targetCameraY = unusualPoop.y - GAME_HEIGHT / 2;
                if (targetCameraY > GROUND_Y - GAME_HEIGHT) {
                    targetCameraY = GROUND_Y - GAME_HEIGHT;
                }
                cameraY += (targetCameraY - cameraY) * 0.1;

                if (unusualPoop.y > GROUND_Y - 50) {
                    state = 'CATCHER';
                    createExplosion(unusualPoop.x, GROUND_Y - 50, '#FFD700');
                }
            } 
            else if (state === 'CATCHER') {
                cameraY = GROUND_Y - GAME_HEIGHT;
                
                alien.x += (targetAlienX - 30 - alien.x) * 0.2;
                squirrel.x += (targetAlienX + 40 - squirrel.x) * 0.25;

                if (alien.x < 30) alien.x = 30;
                if (alien.x > GAME_WIDTH - 80) alien.x = GAME_WIDTH - 80;

                spawnTimer++;
                if (spawnTimer > 50 / catcherDifficulty) {
                    spawnTimer = 0;
                    let r = Math.random();
                    let itemType = '🌮';
                    if (r > 0.7) itemType = '💣';
                    else if (r > 0.4) itemType = '🌰';

                    items.push({
                        x: Math.random() * (GAME_WIDTH - 60) + 30,
                        y: cameraY - 50,
                        vy: (Math.random() * 3 + 4) * catcherDifficulty,
                        type: itemType,
                        rotation: Math.random() * Math.PI * 2,
                        rotSpeed: (Math.random() - 0.5) * 0.2
                    });
                    catcherDifficulty += 0.015;
                }

                for (let i = items.length - 1; i >= 0; i--) {
                    let item = items[i];
                    item.y += item.vy;
                    item.rotation += item.rotSpeed;

                    if (item.y > GROUND_Y - 20) {
                        if (item.type !== '💣') {
                            catcherLives--;
                            createExplosion(item.x, item.y, '#ff4444');
                            if (catcherLives <= 0) gameOver("Out of food! You lost!");
                        }
                        items.splice(i, 1);
                        continue;
                    }

                    // Check catch by alien OR squirrel
                    let dxA = item.x - alien.x;
                    let dyA = item.y - (alien.y - 60);
                    let distA = Math.sqrt(dxA*dxA + dyA*dyA);

                    let dxS = item.x - squirrel.x;
                    let dyS = item.y - (GROUND_Y - 40);
                    let distS = Math.sqrt(dxS*dxS + dyS*dyS);

                    if (distA < 45 || distS < 40) {
                        if (item.type === '💣') {
                            createExplosion(item.x, item.y, '#FF0000');
                            gameOver("BOOM! You caught a bomb!");
                        } else {
                            catcherScore += (item.type === '🌰' ? 2 : 1);
                            createExplosion(item.x, item.y, item.type === '🌰' ? '#d97706' : '#FFD700');
                        }
                        items.splice(i, 1);
                    }
                }
            }
            else if (state === 'EATING_ANIMATION') {
                cameraY = GROUND_Y - GAME_HEIGHT;
                eatingTimer++;

                if (eatingTimer % 10 === 0) {
                    let isSquirrelTarget = Math.random() > 0.5;
                    flyingTacos.push({
                        x: GAME_WIDTH/2 + (Math.random() - 0.5) * 100,
                        y: GROUND_Y - 15,
                        targetX: isSquirrelTarget ? squirrel.x : alien.x,
                        targetY: isSquirrelTarget ? GROUND_Y - 50 : GROUND_Y - 185,
                        progress: 0,
                        speed: 0.12,
                        type: Math.random() > 0.5 ? '🌮' : '🌰'
                    });
                }

                for (let i = flyingTacos.length - 1; i >= 0; i--) {
                    let ft = flyingTacos[i];
                    ft.progress += ft.speed;
                    if (ft.progress >= 1) {
                        spawnFoodCrumbs(ft.targetX, ft.targetY);
                        flyingTacos.splice(i, 1);
                    }
                }

                if (eatingTimer % 20 === 0) {
                    const words = ["ZHADNO!! 🌮", "NOM NOM!", "CHOMP!", "NUTTY!! 🌰", "MORE TACOS!", "GLUTTONS!"];
                    let randomWord = words[Math.floor(Math.random() * words.length)];
                    chompTexts.push({
                        text: randomWord,
                        x: GAME_WIDTH/2 + (Math.random() - 0.5) * 180,
                        y: GROUND_Y - 180,
                        vy: -2,
                        alpha: 1,
                        scale: Math.random() * 0.4 + 0.9
                    });
                }

                for (let i = chompTexts.length - 1; i >= 0; i--) {
                    let ct = chompTexts[i];
                    ct.y += ct.vy;
                    ct.alpha -= 0.02;
                    if (ct.alpha <= 0) chompTexts.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            let depthFactor = cameraY / (GROUND_Y - GAME_HEIGHT);
            if (depthFactor < 0) depthFactor = 0;
            if (depthFactor > 1) depthFactor = 1;

            let topColor = interpolateColor('#5bb6ff', '#020212', depthFactor);
            let bottomColor = interpolateColor('#bde1ff', '#0a0510', depthFactor);

            let bgGradient = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
            bgGradient.addColorStop(0, topColor);
            bgGradient.addColorStop(1, bottomColor);
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            ctx.save();
            ctx.translate(0, -cameraY);

            if (cameraY < GAME_HEIGHT) drawClouds();

            let soilGrad = ctx.createLinearGradient(0, GROUND_Y, 0, GROUND_Y + 500);
            soilGrad.addColorStop(0, '#3d2616');
            soilGrad.addColorStop(1, '#170e08');
            ctx.fillStyle = soilGrad;
            ctx.fillRect(0, GROUND_Y, GAME_WIDTH, 500);

            let grassGrad = ctx.createLinearGradient(0, GROUND_Y, 0, GROUND_Y + 25);
            grassGrad.addColorStop(0, '#2fb835');
            grassGrad.addColorStop(1, '#1b5e20');
            ctx.fillStyle = grassGrad;
            ctx.fillRect(0, GROUND_Y, GAME_WIDTH, 25);

            if (state === 'FLAPPY' || state === 'TRANSITION') {
                pipes.forEach(p => {
                    drawRealisticPipe(p.x, 0, p.topHeight, true);
                    drawRealisticPipe(p.x, p.topHeight + PIPE_GAP, GROUND_Y - (p.topHeight + PIPE_GAP), false);
                });
                drawRealisticBird(bird.x, bird.y, bird.vy, bird.frozen);
            }

            if (state === 'TRANSITION' || state === 'CATCHER') {
                if (state === 'TRANSITION') drawRealisticTaco(unusualPoop.x, unusualPoop.y, time * 0.1);

                if (cameraY >= GROUND_Y - GAME_HEIGHT - 200) {
                    drawAlien(alien.x, alien.y, time);
                    drawSquirrel(squirrel.x, GROUND_Y - 25, 1, time);
                }

                items.forEach(item => {
                    if (item.type === '🌮') drawRealisticTaco(item.x, item.y, item.rotation);
                    else if (item.type === '🌰') drawAcorn(item.x, item.y, item.rotation);
                    else drawRealisticBomb(item.x, item.y, item.rotation);
                });
            }

            if (state === 'EATING_ANIMATION') {
                drawTacoPile(GAME_WIDTH / 2, GROUND_Y - 5);

                flyingTacos.forEach(ft => {
                    let curX = ft.x + (ft.targetX - ft.x) * ft.progress;
                    let curY = ft.y + (ft.targetY - ft.y) * ft.progress;
                    if (ft.type === '🌮') drawRealisticTaco(curX, curY, ft.progress * Math.PI * 4);
                    else drawAcorn(curX, curY, ft.progress * Math.PI * 4);
                });

                drawGreedyAlien(alien.x, GROUND_Y - 90, time);
                drawGreedySquirrel(squirrel.x, GROUND_Y - 30, time);

                chompTexts.forEach(ct => {
                    ctx.save();
                    ctx.translate(ct.x, ct.y);
                    ctx.scale(ct.scale, ct.scale);
                    ctx.font = 'bold 32px Arial';
                    ctx.fillStyle = `rgba(250, 204, 21, ${ct.alpha})`;
                    ctx.strokeStyle = `rgba(0, 0, 0, ${ct.alpha})`;
                    ctx.lineWidth = 4;
                    ctx.textAlign = 'center';
                    ctx.strokeText(ct.text, 0, 0);
                    ctx.fillText(ct.text, 0, 0);
                    ctx.restore();
                });
            }

            particles.forEach(p => {
                ctx.fillStyle = p.color || `rgba(255, 215, 0, ${p.life / p.maxLife})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size || (Math.random() * 4 + 2), 0, Math.PI*2);
                ctx.fill();
            });

            ctx.restore();

            if (state === 'FLAPPY') {
                ctx.fillStyle = 'white';
                ctx.strokeStyle = 'black';
                ctx.lineWidth = 4;
                ctx.font = 'bold 50px Arial';
                ctx.textAlign = 'center';
                ctx.strokeText(flappyScore, GAME_WIDTH/2, 100);
                ctx.fillText(flappyScore, GAME_WIDTH/2, 100);
            } else if (state === 'CATCHER') {
                ctx.fillStyle = 'white';
                ctx.strokeStyle = 'black';
                ctx.lineWidth = 3;
                ctx.font = 'bold 28px Arial';
                
                ctx.textAlign = 'left';
                let scoreText = `Score: ${catcherScore}`;
                ctx.strokeText(scoreText, 20, 40);
                ctx.fillText(scoreText, 20, 40);
                
                ctx.textAlign = 'right';
                let livesStr = "";
                for(let i=0; i<catcherLives; i++) livesStr += "❤️";
                ctx.strokeText(livesStr, GAME_WIDTH - 20, 40);
                ctx.fillText(livesStr, GAME_WIDTH - 20, 40);
            }

            requestAnimationFrame(draw);
            update();
        }

        function drawClouds() {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            clouds.forEach(c => {
                ctx.save();
                ctx.translate(c.x, c.y + cameraY * 0.5);
                ctx.scale(c.scale, c.scale);
                ctx.beginPath();
                ctx.arc(0, 0, 30, 0, Math.PI * 2);
                ctx.arc(25, -15, 30, 0, Math.PI * 2);
                ctx.arc(50, 0, 30, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        function drawRealisticPipe(x, y, height, isTop) {
            let width = PIPE_WIDTH;
            let grad = ctx.createLinearGradient(x, 0, x + width, 0);
            grad.addColorStop(0, '#588c24');
            grad.addColorStop(0.2, '#8fe33b');
            grad.addColorStop(0.5, '#73bf2a');
            grad.addColorStop(1, '#3e6617');

            ctx.fillStyle = grad;
            ctx.fillRect(x, y, width, height);

            let capHeight = 30;
            let capExpand = 6;
            let capY = isTop ? y + height - capHeight : y;

            let capGrad = ctx.createLinearGradient(x - capExpand, 0, x + width + capExpand, 0);
            capGrad.addColorStop(0, '#588c24');
            capGrad.addColorStop(0.2, '#a5f24e');
            capGrad.addColorStop(0.5, '#73bf2a');
            capGrad.addColorStop(1, '#3e6617');

            ctx.fillStyle = capGrad;
            ctx.fillRect(x - capExpand, capY, width + capExpand * 2, capHeight);

            ctx.strokeStyle = '#22380c';
            ctx.lineWidth = 3;
            ctx.strokeRect(x, y, width, height);
            ctx.strokeRect(x - capExpand, capY, width + capExpand * 2, capHeight);
        }

        function drawRealisticBird(x, y, vy, frozen) {
            ctx.save();
            ctx.translate(x, y);
            if (!frozen) ctx.rotate(Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (vy * 0.1))));

            let bodyGrad = ctx.createRadialGradient(-0, -5, 2, 0, 0, 18);
            bodyGrad.addColorStop(0, '#ffec6e');
            bodyGrad.addColorStop(1, '#e5a500');
            ctx.fillStyle = bodyGrad;
            ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(7, -6, 6, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'black'; ctx.beginPath(); ctx.arc(9, -6, 2.5, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = '#ff4500';
            ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(24, 4); ctx.lineTo(12, 10); ctx.closePath(); ctx.fill();

            let wingY = Math.sin(time * 0.3) * 5;
            ctx.fillStyle = '#f39c12';
            ctx.beginPath(); ctx.ellipse(-6, 2 + wingY, 8, 5, Math.PI / 4, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        }

        function drawRealisticTaco(x, y, rotation) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rotation);
            ctx.shadowBlur = 10; ctx.shadowColor = '#facc15';

            ctx.fillStyle = '#eab308';
            ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI); ctx.fill();
            ctx.fillStyle = '#22c55e'; ctx.fillRect(-16, -2, 32, 4);
            ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(-6, -2, 3, 0, Math.PI * 2); ctx.arc(4, -3, 3, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        }

        function drawAcorn(x, y, rotation) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rotation);
            ctx.fillStyle = '#b45309';
            ctx.beginPath(); ctx.arc(0, 4, 12, 0, Math.PI); ctx.fill();
            ctx.fillStyle = '#78350f';
            ctx.fillRect(-12, -6, 24, 8);
            ctx.fillRect(-2, -10, 4, 5);
            ctx.restore();
        }

        function drawTacoPile(x, y) {
            for (let i = -80; i <= 80; i += 20) {
                drawRealisticTaco(x + i, y - Math.abs(i)*0.1, (i%40)*0.1);
                drawAcorn(x + i*0.7, y - 12, (i%30)*0.2);
            }
            drawRealisticTaco(x, y - 25, 0);
        }

        function drawRealisticBomb(x, y, rotation) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rotation);
            ctx.fillStyle = '#0f172a';
            ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#d97706'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(0, -16); ctx.quadraticCurveTo(8, -22, 10, -26); ctx.stroke();
            ctx.fillStyle = time % 4 < 2 ? '#ef4444' : '#facc15';
            ctx.beginPath(); ctx.arc(10, -26, 3, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        }

        function drawAlien(x, y, t) {
            ctx.save();
            ctx.translate(x, y);
            let sway = Math.sin(t * 0.12) * 10;

            ctx.fillStyle = '#4ade80';
            ctx.beginPath(); ctx.ellipse(sway * 0.8, -90, 14, 20, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'black';
            ctx.beginPath(); ctx.ellipse(sway * 0.8 - 5, -92, 4, 7, -Math.PI / 6, 0, Math.PI * 2);
            ctx.ellipse(sway * 0.8 + 5, -92, 4, 7, Math.PI / 6, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = '#16a34a'; ctx.fillRect(-6 + sway * 0.3, -70, 12, 40);
            ctx.restore();
        }

        function drawSquirrel(x, y, scale = 1, t = 0) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);

            let tailWag = Math.sin(t * 0.2) * 0.2;

            // Tail
            ctx.fillStyle = '#b45309';
            ctx.beginPath();
            ctx.moveTo(-10, -10);
            ctx.bezierCurveTo(-45 + tailWag*20, -30, -55 + tailWag*20, -75, -20, -80);
            ctx.bezierCurveTo(-5, -85, 10, -60, -5, -40);
            ctx.fill();

            // Body
            ctx.fillStyle = '#d97706';
            ctx.beginPath(); ctx.ellipse(0, -25, 18, 22, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#fde68a';
            ctx.beginPath(); ctx.ellipse(4, -22, 10, 15, 0, 0, Math.PI * 2); ctx.fill();

            // Head
            ctx.fillStyle = '#d97706';
            ctx.beginPath(); ctx.ellipse(5, -50, 15, 14, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#fde68a';
            ctx.beginPath(); ctx.arc(14, -46, 8, 0, Math.PI * 2); ctx.fill();

            // Ears
            ctx.fillStyle = '#b45309';
            ctx.beginPath(); ctx.ellipse(-2, -66, 4, 9, -0.2, 0, Math.PI * 2);
            ctx.ellipse(8, -66, 4, 9, 0.2, 0, Math.PI * 2); ctx.fill();

            // Eye & Nose
            ctx.fillStyle = 'black'; ctx.beginPath(); ctx.arc(10, -53, 3, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#78350f'; ctx.beginPath(); ctx.arc(18, -49, 3, 0, Math.PI * 2); ctx.fill();

            ctx.restore();
        }

        function drawGreedyAlien(x, y, t) {
            ctx.save();
            ctx.translate(x, y);
            let chew = (Math.random() - 0.5) * 6;
            let mouthChomp = Math.abs(Math.sin(t * 0.4));

            ctx.fillStyle = '#4ade80';
            ctx.beginPath(); ctx.ellipse(chew, -50, 24, 28, 0, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(chew, -95, 18, 24, 0, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.arc(-7 + chew, -102, 7, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(7 + chew, -102, 7, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'black';
            ctx.beginPath(); ctx.arc(-7 + chew, -102, 3, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(7 + chew, -102, 3, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = '#7f1d1d';
            ctx.beginPath(); ctx.ellipse(chew, -85, 12, 12 + mouthChomp * 16, 0, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        }

        function drawGreedySquirrel(x, y, t) {
            ctx.save();
            ctx.translate(x, y);

            let chew = Math.sin(t * 0.5) * 4;

            // Huge puffed-out cheeks full of tacos & acorns!
            ctx.fillStyle = '#d97706';
            ctx.beginPath(); ctx.ellipse(0, -35, 22, 25, 0, 0, Math.PI * 2); ctx.fill();

            // Head
            ctx.beginPath(); ctx.ellipse(0, -65, 20, 18, 0, 0, Math.PI * 2); ctx.fill();

            // GIANT puffed cheeks (ZHADNO!)
            ctx.fillStyle = '#fde68a';
            ctx.beginPath(); ctx.arc(-14, -60, 14 + chew, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(14, -60, 14 + chew, 0, Math.PI * 2); ctx.fill();

            // Eyes crazy with taco greed
            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.arc(-8, -72, 6, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(8, -72, 6, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'black';
            ctx.beginPath(); ctx.arc(-8, -72, 3, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(8, -72, 3, 0, Math.PI * 2); ctx.fill();

            // Fast shoveling squirrel hands
            drawAcorn(-5, -60, chew);
            drawRealisticTaco(5, -60, -chew);

            ctx.restore();
        }

        function spawnFoodCrumbs(x, y) {
            const colors = ['#eab308', '#22c55e', '#b45309', '#facc15'];
            for (let i = 0; i < 6; i++) {
                particles.push({
                    x: x + (Math.random() - 0.5) * 30,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8 - 2,
                    life: 20,
                    maxLife: 20,
                    color: colors[Math.floor(Math.random() * colors.length)]
                });
            }
        }

        function spawnPipe() {
            let minHeight = 60;
            let maxHeight = GAME_HEIGHT - PIPE_GAP - minHeight;
            let topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1) + minHeight);
            pipes.push({ x: GAME_WIDTH, topHeight: topHeight, passed: false });
        }

        function triggerTransition() {
            state = 'TRANSITION';
            bird.frozen = true;
            unusualPoop.x = bird.x; unusualPoop.y = bird.y; unusualPoop.vy = -4;
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 20; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 20, maxLife: 20, color: color
                });
            }
        }

        function interpolateColor(color1, color2, factor) {
            let c1 = hexToRgb(color1); let c2 = hexToRgb(color2);
            let r = Math.round(c1.r + factor * (c2.r - c1.r));
            let g = Math.round(c1.g + factor * (c2.g - c1.g));
            let b = Math.round(c1.b + factor * (c2.b - c1.b));
            return `rgb(${r},${g},${b})`;
        }

        function hexToRgb(hex) {
            let result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : {r:0, g:0, b:0};
        }

        requestAnimationFrame(draw);
    </script>
</body>
